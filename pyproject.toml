[project]
name = "cecilystuff"
version = "0.1.0"
description = "Data processing and simulation tools"
requires-python = ">=3.13"
dependencies = [
    "imageio>=2.37.4",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
    "tifffile>=2026.8.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.400",
    "ruff>=0.14",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes: undefined names, unused imports
    "W",    # whitespace
    "I",    # import sorting
    "UP",   # outdated syntax
    "B",    # bugbear: likely bugs
    "SIM",  # simplifications
    "NPY",  # numpy-specific
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.pyright]
include = ["processing"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryIsInstance = "error"

[tool.pytest.ini_options]
testpaths = ["processing"]
addopts = "-q"
